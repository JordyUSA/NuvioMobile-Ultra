name: Build FFmpegKit iOS frameworks

# Mirrors build-ffmpeg-kit.yml (the Android AAR build), for the same reason: FFmpegKit was
# retired in January 2025 and its prebuilt binaries pulled, but the source and build scripts
# still work. This job compiles the iOS frameworks ourselves.
#
# ios.sh (v6.0) does not produce xcframeworks — that turned out to be a wrong assumption from
# the first version of this workflow. It bundles each library as a plain, universal
# (multi-architecture) .framework under prebuilt/bundle-apple-framework-ios/, one fat Mach-O
# binary per library holding every architecture that was built. That is the pre-xcframework
# format, but it still links into Xcode exactly like GoogleCast.framework would if GoogleCast
# were not already an xcframework, and it sidesteps xcframeworks' only reason to exist here —
# disambiguating an arm64 device slice from an arm64 simulator slice — since this build targets
# arm64 device plus x86-64 simulator, which a fat binary can hold without conflict.
#
# Unlike the Android build, this one is deliberately GPL: it enables libx264 so CastTranscoder
# has a software H.264 fallback for when VideoToolbox hardware encoding is unavailable or
# refuses a particular stream. That is a real license consequence, not a formality — anything
# these frameworks are linked into must be distributed under terms compatible with the GPL.
# That is acceptable here because this project ships as a sideloaded IPA, not through the App
# Store.
#
# Download the artifact, unzip it, and drop the *.framework directories into
# iosApp/Frameworks/FFmpegKit/. A human (or a follow-up commit) still has to wire them into
# iosApp.xcodeproj's Frameworks build phase, the same way GoogleCast.xcframework was linked.

on:
  push:
    paths:
      - '.github/workflows/build-ffmpegkit-ios.yml'
  workflow_dispatch:
    inputs:
      ffmpeg_kit_ref:
        description: 'ffmpeg-kit git ref to build'
        required: true
        default: 'v6.0'
      include_simulator:
        description: 'Also build the x86-64 simulator slice, for local Simulator development'
        type: boolean
        required: false
        default: true

concurrency:
  group: build-ffmpegkit-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    # A full multi-slice FFmpeg build on a macOS runner can run for hours in the worst case;
    # give it headroom short of the 6-hour hosted-runner ceiling so a hang is caught before
    # that. In practice, this minimal component set (x264, openssl, ffmpeg, ffmpeg-kit) across
    # two architectures takes under 15 minutes.
    timeout-minutes: 340

    env:
      FFMPEG_KIT_REF: ${{ inputs.ffmpeg_kit_ref || 'v6.0' }}
      INCLUDE_SIMULATOR: ${{ inputs.include_simulator == true || github.event_name == 'push' }}

    steps:
      - name: Reclaim disk space
        # macOS runners ship several Xcode versions and a full set of simulator runtimes,
        # which between them account for most of the disk. None of that is needed to cross
        # compile FFmpeg, and an unattended multi-architecture build that runs out of space
        # fails hours in with a confusing linker error rather than a clear one up front.
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Applications/Xcode_15*.app /Applications/Xcode_14*.app || true
          sudo rm -rf "$ANDROID_HOME" "$ANDROID_SDK_ROOT" || true
          echo "After:"; df -h / | tail -1

      - name: Install build tooling
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config nasm yasm gperf \
            texinfo bison meson ninja

      - name: Pin CMake 3.x
        # The Android build hit ffmpeg-kit's cpu-features subproject failing to configure under
        # CMake 4's stricter cmake_minimum_required enforcement. cpu-features is Android-only,
        # but other bundled third-party CMake projects in ffmpeg-kit are old enough to have the
        # same problem, so pin defensively here too rather than waiting to hit it.
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages 'cmake==3.31.6'
          echo "$HOME/Library/Python/$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')/bin" >> "$GITHUB_PATH"

      - name: Verify CMake and Xcode
        run: |
          which cmake
          cmake --version | head -1
          xcodebuild -version

      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit
          ref: ${{ env.FFMPEG_KIT_REF }}
          path: ffmpeg-kit

      - name: Build
        working-directory: ffmpeg-kit
        run: |
          set -euo pipefail

          # Every non-device slice ios.sh knows how to build costs a full second (or third)
          # pass through every one of FFmpeg's component libraries. armv7/armv7s/i386/arm64e
          # cover hardware or Xcode toolchains this project does not target, so they are
          # dropped unconditionally; the simulator slice is kept only for local development
          # convenience and can be turned off for a faster iteration build.
          args=(
            "--disable-armv7"
            "--disable-armv7s"
            "--disable-arm64e"
            "--disable-i386"
            # Hardware decode/encode passthrough, so CastTranscoder can ask for
            # h264_videotoolbox before ever falling back to the software encoder below.
            "--enable-ios-videotoolbox"
            # TLS, so https:// sources can be read directly without a manual cert bundle.
            "--enable-openssl"
            # The whole reason this workflow is GPL rather than mirroring the Android build:
            # a software H.264 encoder for when VideoToolbox is busy or refuses the input.
            # ffmpeg-kit requires --enable-gpl to be passed explicitly alongside any
            # GPL-licensed component; it is not implied by --enable-x264 alone.
            "--enable-gpl"
            "--enable-x264"
          )

          if [ "${INCLUDE_SIMULATOR}" != "true" ]; then
            args+=("--disable-x86-64")
          fi

          echo "Building with: ${args[*]}"
          # ios.sh prints only "<component>: failed" on the console and defers detail to
          # build.log, so surface the tail of it in the job output rather than only as an
          # artifact nobody looks at until the job is already marked green.
          if ! ./ios.sh "${args[@]}"; then
            echo "::group::build.log (last 400 lines)"
            tail -n 400 build.log 2>/dev/null || echo "(no build.log)"
            echo "::endgroup::"
            exit 1
          fi

      - name: Locate the frameworks
        id: locate
        working-directory: ffmpeg-kit
        run: |
          set -euo pipefail
          mkdir -p ../dist

          echo "::group::prebuilt/ layout"
          find prebuilt -maxdepth 4 2>/dev/null || echo "(no prebuilt/ directory)"
          echo "::endgroup::"

          # ios.sh's final step lipo's every built architecture into one universal .framework
          # per library under this directory. Prefer it explicitly over a blind repo-wide
          # search: prebuilt/apple-ios-<arch>/ffmpeg/framework/*.framework also matches
          # "*.framework" but holds only a single architecture each, which would silently ship
          # a device-only or simulator-only binary depending on search order.
          bundle_dir="$(find . -type d -iname 'bundle-apple-framework-ios' -print -quit)"

          found=0
          if [ -n "$bundle_dir" ]; then
            while IFS= read -r -d '' framework; do
              cp -RL "$framework" ../dist/
              echo "Found: $framework"
              found=$((found + 1))
            done < <(find "$bundle_dir" -mindepth 1 -maxdepth 1 -iname '*.framework' \( -type d -o -type l \) -print0)
          fi

          if [ "$found" -eq 0 ]; then
            # A ref where the bundle directory is named or laid out differently: fall back to
            # a repo-wide search (xcframework first, since that is the modern format; plain
            # framework second) rather than failing outright.
            echo "::group::bundle-apple-framework-ios not found or empty; searching the whole checkout"
            find -L . -iname '*.framework' -o -iname '*.xcframework' 2>/dev/null
            echo "::endgroup::"
            while IFS= read -r -d '' framework; do
              cp -RL "$framework" ../dist/
              echo "Found (fallback): $framework"
              found=$((found + 1))
            done < <(find -L . \( -iname '*.xcframework' -o -iname '*.framework' \) \( -type d -o -type l \) -print0)
          fi

          if [ "$found" -eq 0 ]; then
            echo "::error::ios.sh finished but produced no .framework or .xcframework directories; see the layout above"
            exit 1
          fi
          echo "count=$found" >> "$GITHUB_OUTPUT"

      - name: Verify the frameworks actually contain binaries
        # The whole reason build-ffmpeg-kit.yml exists for Android is that a substitute build
        # can silently produce an archive with no native code in it. Check the same thing here:
        # every bundle should carry a non-empty Mach-O binary, not a stub, and it should
        # actually contain the arm64 slice a device build needs.
        run: |
          set -euo pipefail
          shopt -s nullglob
          problems=0
          for bundle in dist/*.framework dist/*.xcframework; do
            [ -e "$bundle" ] || continue
            name="$(basename "$bundle")"
            name="${name%.framework}"
            name="${name%.xcframework}"
            binary="$(find "$bundle" -name "$name" -type f -print -quit 2>/dev/null || true)"
            if [ -z "$binary" ] || [ ! -s "$binary" ]; then
              echo "::error::$bundle has no non-empty binary named $name"
              problems=$((problems + 1))
              continue
            fi
            archs="$(lipo -archs "$binary" 2>/dev/null || echo unknown)"
            echo "$bundle: $(du -h "$binary" | cut -f1), architectures: $archs"
            case " $archs " in
              *" arm64 "*) ;;
              *)
                echo "::error::$bundle's binary has no arm64 slice (architectures: $archs)"
                problems=$((problems + 1))
                ;;
            esac
          done
          if [ "$problems" -gt 0 ]; then
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          bundles=(*.framework *.xcframework)
          zip -qry "../ffmpegkit-ios-${FFMPEG_KIT_REF}-min-gpl.zip" "${bundles[@]}"
          cd ..
          ls -lh "ffmpegkit-ios-${FFMPEG_KIT_REF}-min-gpl.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-${{ env.FFMPEG_KIT_REF }}-min-gpl
          path: ffmpegkit-ios-${{ env.FFMPEG_KIT_REF }}-min-gpl.zip
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-build-log
          path: ffmpeg-kit/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: success()
        run: |
          {
            echo "## FFmpegKit iOS frameworks built"
            echo ""
            echo "GPL build: libx264 enabled for a software H.264 fallback. VideoToolbox and"
            echo "OpenSSL are enabled; no other GPL/paid-codec components are included."
            echo ""
            echo '1. Download the artifact and unzip it.'
            echo '2. Put every `*.framework` directory in `iosApp/Frameworks/FFmpegKit/`.'
            echo '3. Wire each one into the Frameworks build phase of iosApp.xcodeproj.'
          } >> "$GITHUB_STEP_SUMMARY"
