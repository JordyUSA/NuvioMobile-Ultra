name: Build iOS IPA

on:
  push:
    branches:
      - feature/chromecast-hw-transcoding
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # FIX 1: Fetches full git history and tags to resolve Git exit code 128

    - name: Mark workspace as safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" # Backup safety check for runner git permissions
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # FIX 3: Replaced deprecated gradle-build-action to fix cache 400 errors
    
    - name: Build iOS Release
      run: |
        ./gradlew :composeApp:linkReleaseFrameworkIosArm64
        ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64
      continue-on-error: false # FIX 2: Removed 'cd composeApp' so it calls ./gradlew from the root folder
    
    - name: Setup iOS project
      run: |
        cd iosApp
        pod install --repo-update
    
    - name: Build IPA for device
      run: |
        cd iosApp
        xcodebuild \
          -workspace NuvioMobile.xcworkspace \
          -scheme NuvioMobile \
          -configuration Release \
          -derivedDataPath build \
          -destination 'generic/platform=iOS' \
          -archivePath build/NuvioMobile.xcarchive \
          archive
    
    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath iosApp/build/NuvioMobile.xcarchive \
          -exportOptionsPlist .github/ExportOptions.plist \
          -exportPath iosApp/build/
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuvioMobile.ipa
        path: iosApp/build/NuvioMobile.ipa
        retention-days: 30
    
    - name: Generate download link
      run: |
        echo "## 📱 iOS IPA Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "The IPA file is ready for download from the Artifacts section." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Sideloading Instructions:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA file from artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Use AltStore or Sideloadly to sideload the IPA" >> $GITHUB_STEP_SUMMARY
        echo "3. Install on your iPhone" >> $GITHUB_STEP_SUMMARY
