name: Build iOS IPA

on:
  push:
    branches:
      - feature/chromecast-hw-transcoding
    # None of these can change the iOS framework, so they must not start a three-hour
    # macOS build. Android sources are not on the iOS compile path at all.
    # An allowlist, not a denylist. paths-ignore only skips a run when every changed file
    # matches, so a commit touching one Android file alongside anything else still started a
    # three-hour macOS build. These are the only inputs that can change the iOS framework.
    paths:
      - 'composeApp/src/commonMain/**'
      - 'composeApp/src/fullCommonMain/**'
      - 'composeApp/src/iosMain/**'
      - 'composeApp/src/iosFull/**'
      - 'composeApp/src/iosAppStore/**'
      - 'composeApp/src/nativeInterop/**'
      - 'composeApp/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'iosApp/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

# Only the newest commit on a branch is worth building. Without this, a run is started for
# every push and they all continue in parallel, which on macOS runners bills at ten times the
# Linux rate for results that are already obsolete.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    # This build legitimately takes two to three hours, but without a ceiling a hang would
    # burn the full six-hour maximum before GitHub intervenes. 240 was too tight: a healthy
    # run is ~2h45m (1h25m linking the Kotlin framework, 1h18m in xcodebuild), leaving barely
    # an hour of slack, and a slow runner ate all of it — one run reached three hours still
    # linking, which meant the archive step could not have finished inside the ceiling no
    # matter what. Still well under the six-hour maximum, so a genuine hang is still caught.
    timeout-minutes: 330

    env:
      # The "full" distribution links against nuvio-engine's NuvioEngine.xcframework, which
      # lives outside this repository and is never present on CI. Build the appstore
      # distribution instead, whose iosAppStore source set stubs out the native P2P engine.
      NUVIO_IOS_DISTRIBUTION: appstore
      # Heap sizes are deliberately NOT set here. GRADLE_OPTS is the lowest-priority source
      # Gradle consults, so the -Xmx6g that used to live here was silently overridden by
      # org.gradle.jvmargs in gradle.properties and never took effect. They are written to
      # ~/.gradle/gradle.properties below instead, which does outrank the project file.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Mark workspace as safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # MPVKit is referenced by iosApp.xcodeproj as a local Swift package at ../MPVKit.
    # Only this submodule is initialised: several other gitlinks in the index have no
    # .gitmodules entry, so a blanket `submodules: true` checkout aborts on them.
    - name: Checkout MPVKit submodule
      run: git submodule update --init --depth 1 MPVKit

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # The repository's gradle.properties is tuned for a developer workstation: it asks for a
    # 12 GB Gradle daemon, an 8 GB Kotlin daemon and a 16 GB Kotlin/Native compiler. A
    # macos-latest runner has 7 GB of RAM and 3 cores. Those ceilings do not fail loudly —
    # they let the native linker's heap grow into swap instead of collecting, and the machine
    # thrashes: the release link took 1h20m on the run that passed and then stopped finishing
    # at all, producing no output for five and a half hours before the job timed out.
    #
    # The release linker's real appetite has been bracketed by experiment: 16 GB let it grow
    # into swap and stall forever, 4 GB made it die instantly with OutOfMemoryError. So it
    # needs more than 4 GB of live heap and the budget here is 7 GB of physical RAM, most of
    # which has to go to the linker — everything else is squeezed to the minimum that still
    # works, and parallelism is off so no second worker competes for the same memory.
    #
    # GRADLE_USER_HOME/gradle.properties outranks the project's own file, so this overrides
    # the workstation values without touching them for local development.
    - name: Size the JVMs for a 7 GB runner
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        kotlin.daemon.jvmargs=-Xmx1200m
        kotlin.native.jvmArgs=-Xmx5g
        org.gradle.workers.max=1
        EOF
        cat ~/.gradle/gradle.properties

    # The Kotlin/Native toolchain — compiler, LLVM and sysroots — is a multi-gigabyte download
    # that setup-gradle's cache does not cover, so it is fetched from scratch on every run.
    - name: Cache the Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-

    # Fixes: Task :composeApp:generateRuntimeConfigs FAILED
    - name: Create local.properties
      run: touch local.properties

    # Fail fast with readable Kotlin diagnostics before handing off to xcodebuild,
    # which would otherwise bury compiler errors inside the Gradle build-phase log.
    # Capped well under the job ceiling on purpose: this step is where a memory-starved
    # native link stalls, and a stall here used to consume the entire job budget before
    # anything reported it. With the heaps sized correctly the link is minutes, not hours,
    # so overrunning this means the machine is thrashing again — worth failing fast to say so
    # rather than paying for another five-hour runner.
    - name: Compile Kotlin iOS framework
      timeout-minutes: 90
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

    # There is no Podfile in this project: iosApp.xcodeproj is built directly, and its
    # build phase invokes :composeApp:embedAndSignAppleFrameworkForXcode itself.
    - name: Archive app (unsigned)
      run: |
        xcodebuild \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -derivedDataPath ios-build/DerivedData \
          -destination 'generic/platform=iOS' \
          -archivePath ios-build/NuvioMobile.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          DEVELOPMENT_TEAM="" \
          archive

    # An unsigned archive cannot go through -exportArchive, which insists on resolving a
    # signing identity. Sideloading tools re-sign the payload anyway, so package by hand.
    - name: Package IPA
      run: |
        set -euo pipefail
        app_path="$(find ios-build/NuvioMobile.xcarchive/Products/Applications \
          -maxdepth 1 -name '*.app' -print -quit)"
        if [ -z "$app_path" ]; then
          echo "::error::No .app found in the archive"
          exit 1
        fi
        echo "Packaging $app_path"
        rm -rf ios-build/ipa && mkdir -p ios-build/ipa/Payload
        cp -R "$app_path" ios-build/ipa/Payload/
        (cd ios-build/ipa && zip -qry ../NuvioMobile.ipa Payload)
        ls -lh ios-build/NuvioMobile.ipa

    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuvioMobile.ipa
        path: ios-build/NuvioMobile.ipa
        retention-days: 30

    - name: Generate download link
      run: |
        echo "## 📱 iOS IPA Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "The IPA file is ready for download from the Artifacts section." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "This build is **unsigned** — your sideloading tool signs it with your own account." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Sideloading Instructions:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA file from artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Use AltStore or Sideloadly to sideload the IPA" >> $GITHUB_STEP_SUMMARY
        echo "3. Install on your iPhone" >> $GITHUB_STEP_SUMMARY
